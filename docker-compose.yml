version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatpay_backend
    ports:
      - "3000:3000"
    volumes:
      # Persist WhatsApp session
      - ./backend/.wwebjs_auth:/app/.wwebjs_auth
      # Persist Application Data (Customers, Templates, Transactions)
      - ./backend/data:/app/data
      # Make sure the private key is passed
      - ./backend/keys:/app/keys
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatpay_frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
